<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terragnos AgOperating Systems</title>
  <meta name="description" content="Terragnos AgOperating Systems. Managing the margins from the ground up. Know the Earth. Master the margin. Beef and sheep worksheets free, no account." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #036A38;
      --green-light: #e8f5ee;
      --green-glow: rgba(3, 106, 56, 0.12);
      --cream: #faf8f5;
      --loam: #1f1a14;
      --muted: #6b6560;
      --border: #e0dbd5;
      --input-bg: #f7f5f2;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--loam);
      min-height: 100vh;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .bg-glow::before {
      content: ''; position: absolute; top: -40%; right: -20%;
      width: 800px; height: 800px; background: var(--green-glow);
      border-radius: 50%; filter: blur(120px);
    }
    .bg-glow::after {
      content: ''; position: absolute; bottom: -30%; left: -15%;
      width: 600px; height: 600px; background: rgba(139, 105, 20, 0.06);
      border-radius: 50%; filter: blur(100px);
    }
    header, main, footer { position: relative; z-index: 1; }
    header.pager-bar {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      padding: 1.25rem 1.5rem; gap: 0.75rem;
    }
    a.pager-btn {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1rem; border-radius: 0.5rem;
      border: 1px solid var(--border); color: var(--loam);
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      background: white;
    }
    a.pager-btn:hover { border-color: var(--green); background: var(--green-light); }
    .pager-now { font-weight: 700; min-width: 4.5rem; text-align: center; }
    .hero {
      text-align: center; padding: 2rem 1.5rem 3rem; max-width: 860px; margin: 0 auto;
    }
    .video-frame { width: 100%; max-width: 520px; margin: 0 auto 2rem; }
    .video-outer {
      border-radius: 1.5rem;
      background: linear-gradient(135deg, rgba(245, 235, 220, 0.5), rgba(214, 204, 190, 0.5));
      padding: 0.5rem;
      box-shadow: 0 20px 60px rgba(3, 106, 56, 0.1), 0 4px 16px rgba(0,0,0,0.06);
    }
    .video-inner {
      width: 100%; aspect-ratio: 928 / 510;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 1rem; border: 1px solid rgba(200, 180, 140, 0.3);
      overflow: hidden;
    }
    .video-inner video { width: 100%; height: 100%; object-fit: contain; }
    .kicker {
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--green); margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700; line-height: 1.15; margin-bottom: 0.75rem;
    }
    h1 span { color: var(--green); }
    .tagline {
      font-size: 1.15rem; line-height: 1.6; color: var(--muted);
      max-width: 620px; margin: 0 auto 0.5rem;
    }
    .tagline strong { color: var(--loam); font-weight: 600; }
    .etymology {
      font-size: 0.9rem; color: var(--muted); font-style: italic; margin-bottom: 2rem;
    }
    .buttons {
      display: flex; flex-wrap: wrap; gap: 0.85rem; justify-content: center; margin-bottom: 1.25rem;
    }
    a.btn-primary, a.btn-outline {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 1.75rem; border-radius: 0.75rem;
      font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    a.btn-primary {
      background: var(--green); color: white; border: none;
      box-shadow: 0 8px 24px rgba(3, 106, 56, 0.25);
    }
    a.btn-primary:hover { background: #025a2f; }
    a.btn-outline {
      background: transparent; color: var(--loam); border: 1px solid #d1ccc6;
    }
    a.btn-outline:hover {
      border-color: var(--green); background: var(--green-light);
    }
    footer {
      text-align: center; padding: 2rem 1.5rem; color: var(--muted); font-size: 0.8rem;
    }
    @media (max-width: 520px) {
      .hero { padding: 1.25rem 1.25rem 2rem; }
    }
  </style>
</head>
<body>
<div class="bg-glow"></div>
<header class="pager-bar">
  <a class="pager-btn" href="https://app.terragnos.com/herdflow-sheep">← Sheep</a>
  <span class="pager-now">Home</span>
  <a class="pager-btn" href="https://app.terragnos.com/herdflow">Beef →</a>
</header>
<section class="hero">
  <div class="video-frame">
    <div class="video-outer">
      <div class="video-inner">
        <video src="hero-light.mp4" autoplay loop muted playsinline></video>
      </div>
    </div>
  </div>
  <p class="kicker">Terragnos AgOperating Systems</p>
  <h1>Managing the margins <span>from the ground up</span></h1>
  <p class="tagline"><strong>Know the Earth. Master the margin.</strong></p>
  <p class="etymology">Terragnos — earth and knowledge.</p>
  <div class="buttons">
    <a class="btn-primary" href="https://app.terragnos.com/herdflow">Beef worksheet</a>
    <a class="btn-primary" href="https://app.terragnos.com/herdflow-sheep">Sheep worksheet</a>
    <a class="btn-outline" href="contact.html">Notify me of launch</a>
  </div>
</section>

<footer>
  &copy; 2026 Terragnos, Inc.
</footer>
</body>
</html>
