<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notify me of launch — Terragnos</title>
  <meta name="description" content="Leave your name and email. Terragnos will write when launch is ready." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #036A38;
      --green-light: #e8f5ee;
      --cream: #faf8f5;
      --loam: #1f1a14;
      --muted: #6b6560;
      --border: #e0dbd5;
      --input-bg: #f7f5f2;
      --error-bg: #fde8e8;
      --error: #8b1e1e;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--loam);
      min-height: 100vh;
    }
    header.pager-bar {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      padding: 1.25rem 1.5rem; gap: 0.75rem;
    }
    a.pager-btn {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1rem; border-radius: 0.5rem;
      border: 1px solid var(--border); color: var(--loam);
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      background: white;
    }
    a.pager-btn:hover { border-color: var(--green); background: var(--green-light); }
    .pager-now { font-weight: 700; min-width: 4.5rem; text-align: center; color: var(--loam); text-decoration: none; }
    main {
      max-width: 560px; margin: 0 auto; padding: 1rem 1.5rem 3rem;
    }
    h1 {
      font-family: 'Outfit', sans-serif; font-size: 1.75rem; margin-bottom: 0.35rem;
    }
    .lede { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
    .card {
      background: white; border: 1px solid var(--border); border-radius: 1.25rem;
      padding: 1.75rem;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .form-row .form-group { margin-bottom: 0; }
    .form-group label { font-size: 0.85rem; font-weight: 600; }
    .form-group input, .form-group textarea {
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
      padding: 0.65rem 0.85rem; border: 1px solid var(--border);
      border-radius: 0.5rem; background: var(--input-bg); color: var(--loam); outline: none;
    }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .btn-submit {
      display: inline-flex; align-items: center;
      padding: 0.85rem 1.5rem; border-radius: 0.75rem;
      background: var(--green); color: white; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background: #025a2f; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-note {
      display: none; padding: 0.75rem 0.85rem; border-radius: 0.5rem;
      font-size: 0.9rem; margin-bottom: 1rem;
    }
    .form-note.active { display: block; background: var(--green-light); color: var(--green); }
    .form-note.error { display: block; background: var(--error-bg); color: var(--error); }
    footer {
      text-align: center; padding: 2rem 1.5rem; color: var(--muted); font-size: 0.8rem;
    }
    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<script src="public-os-door.js"></script>
<header class="pager-bar">
  <a class="pager-btn" data-os-door="sheep" href="https://terragnos.com/contact.html">← Sheep</a>
  <a class="pager-now" href="index.html">Home</a>
  <a class="pager-btn" data-os-door="beef" href="https://terragnos.com/contact.html">Beef →</a>
</header>
<main>
  <h1>Notify me of launch</h1>
  <p class="lede">The beef and sheep worksheets open at launch. Leave your name and email. We store the note and write when launch is ready. If this form cannot send, write inquiries@terragnos.com.</p>
  <div class="card">
    <p class="form-note" id="formNote"></p>
    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" required minlength="2" />
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Optional"></textarea>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Send</button>
    </form>
  </div>
</main>
<footer>
  &copy; 2026 Terragnos, Inc.
</footer>
<script>
document.getElementById("contactForm").addEventListener("submit", async function (event) {
  event.preventDefault();
  var form = event.target;
  var note = document.getElementById("formNote");
  var btn = document.getElementById("submitBtn");
  note.className = "form-note";
  note.textContent = "";
  btn.disabled = true;
  try {
    var response = await fetch("https://app.terragnos.com/api/contact-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        requestType: "general",
        message: form.message.value.trim(),
        source: "splash-launch"
      })
    });
    if (response.status === 201) {
      note.textContent = "We received your note. We will write when launch is ready.";
      note.className = "form-note active";
      form.reset();
    } else {
      note.textContent = "The form did not go through. Write inquiries@terragnos.com.";
      note.className = "form-note error";
    }
  } catch (err) {
    note.textContent = "The form did not go through. Write inquiries@terragnos.com.";
    note.className = "form-note error";
  } finally {
    btn.disabled = false;
  }
});
</script>
<script>terragnosApplyOsDoor();</script>
</body>
</html>
